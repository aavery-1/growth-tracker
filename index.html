  <style>
    /* IBM Carbon Design System: White theme tokens, g100 for dark */
    :root {
      --cds-background: #ffffff; --cds-layer-01: #f4f4f4; --cds-layer-hover-01: #e8e8e8; --cds-layer-active-01: #c6c6c6;

      --cds-icon-secondary: #525252; --cds-focus: #0f62fe; --cds-field-02: #ffffff; --cds-border-strong-01: #8d8d8d;
      --cds-text-placeholder: #a8a8a8; --cds-link-inverse: #78a9ff; --cds-text-on-color: #ffffff; --cds-lead: #001d6c; /* blue-90 */
      --cds-lead-secondary: #c6c6c6; --cds-shadow: rgba(0, 0, 0, .3);
      --cds-font: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif;
    }
    :root[data-theme="dark"] {
      --cds-background: #161616; --cds-layer-01: #262626; --cds-layer-hover-01: #333333; --cds-layer-active-01: #525252;
      --cds-border-subtle-01: #393939; --cds-text-primary: #f4f4f4; --cds-text-secondary: #c6c6c6; --cds-icon-primary: #f4f4f4;
      --cds-icon-secondary: #c6c6c6; --cds-focus: #ffffff; --cds-shadow: rgba(0, 0, 0, .8);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: var(--cds-background); color: var(--cds-text-primary); font-family: var(--cds-font); font-size: 14px; line-height: 1.42857; letter-spacing: .16px; -webkit-font-smoothing: antialiased; }
    .cds-grid { max-width: 1584px; margin: 0 auto; padding: 0 32px; }

    /* UI shell header */
    .cds--header { height: 48px; display: flex; align-items: center; border-bottom: 1px solid var(--cds-border-subtle-01); background: var(--cds-background); }
    .cds--header .cds-grid { width: 100%; display: flex; align-items: center; gap: 16px; }
    .cds--header img { height: 18px; display: block; flex: none; }
    :root[data-theme="dark"] .cds--header img { filter: brightness(0) invert(1); }
    .cds--header__name { font-size: 14px; font-weight: 600; line-height: 1.28572; white-space: nowrap; padding-left: 16px; border-left: 1px solid var(--cds-border-subtle-01); }

    /* Lead space */
    .lead { background: var(--cds-layer-01, #f4f4f4); color: var(--cds-text-primary, #161616); padding: 32px 0; border-bottom: 1px solid var(--cds-border-subtle-01, #e0e0e0); }
    .lead .row { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; max-width: 800px; }
    .lead h1 { margin: 0; font-size: 28px; font-weight: 400; line-height: 36px; letter-spacing: 0; }  /* heading-04 */
    .cds--search { position: relative; }
    .cds--search__field { display: flex; align-items: center; height: 48px; background: var(--cds-field-02); border-bottom: 1px solid var(--cds-border-strong-01); }
    .cds--search__field:focus-within { outline: 2px solid var(--cds-focus); outline-offset: -2px; }
    :root[data-theme="dark"] .cds--search__field:focus-within { outline-color: #0f62fe; }
    .cds--search__field svg { flex: none; margin: 0 16px; fill: #525252; }
    .cds--search__input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; font: 400 16px/1.375 var(--cds-font); letter-spacing: 0; color: #161616; padding-right: 16px; }
    .cds--search__input::placeholder { color: var(--cds-text-placeholder); }
    .cds--list-box__menu { position: absolute; left: 0; right: 0; top: 100%; z-index: 9100; margin: 0; padding: 0; list-style: none; background: #ffffff; box-shadow: 0 2px 6px var(--cds-shadow); }
    .cds--list-box__menu[hidden] { display: none; }
    .cds--list-box__menu-item a { display: flex; justify-content: space-between; align-items: center; gap: 16px; height: 40px; padding: 0 16px; color: #161616; text-decoration: none; font-size: 14px; }
    .cds--list-box__menu-item + .cds--list-box__menu-item a { border-top: 1px solid #e0e0e0; }
    .cds--list-box__menu-item a span { color: #525252; font-size: 12px; letter-spacing: .32px; white-space: nowrap; }
    .cds--list-box__menu-item a:hover { background: #e8e8e8; }
    .cds--list-box__menu-item a[aria-selected="true"] { background: #e0e0e0; outline: 2px solid #0f62fe; outline-offset: -2px; }
    .cds--list-box__empty { padding: 11px 16px; color: #525252; }
    .last { margin: 16px 0 0; color: var(--cds-text-secondary, #525252); font-size: 16px; line-height: 1.5; letter-spacing: 0; }
    .last[hidden] { display: none; }
    .cds--link { color: var(--cds-link-primary, #0f62fe); text-decoration: none; }
    .cds--link:hover { text-decoration: underline; }
    .cds--link:focus { outline: 1px solid #ffffff; }

    /* Workstream tiles */
    main { padding: 48px 0 80px; }
    .section-title { margin: 0 0 24px; font-size: 28px; font-weight: 400; line-height: 1.28572; letter-spacing: 0; }  /* heading-04 */
    .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 32px; }
    .cds--tile--clickable { display: flex; flex-direction: column; justify-content: space-between; min-height: 224px; padding: 16px; background: var(--cds-layer-01); color: var(--cds-text-primary); text-decoration: none; outline: 2px solid transparent; outline-offset: -2px; transition: background-color 70ms cubic-bezier(0, 0, .38, .9); }
    .cds--tile--clickable:hover { background: var(--cds-layer-hover-01); }
    .cds--tile--clickable:active { background: var(--cds-layer-active-01); }
    .cds--tile--clickable:focus { outline-color: var(--cds-focus); }
    .cds--tile--clickable svg { width: 64px; height: 64px; fill: var(--cds-icon-primary); }
    .cds--tile--clickable h2 { margin: 32px 0 0; font-size: 20px; font-weight: 400; line-height: 1.4; letter-spacing: 0; }  /* heading-03 */
    .cds--tile--clickable { position: relative; }
    .cds--tile--clickable svg.arrow { position: absolute; right: 16px; bottom: 16px; width: 20px; height: 20px; fill: #0f62fe; transition: transform 110ms cubic-bezier(.2, 0, .38, .9); }
    :root[data-theme="dark"] .cds--tile--clickable svg.arrow { fill: #78a9ff; }
    .cds--tile--clickable:hover svg.arrow { transform: translateX(4px); }
    .cds--tile--clickable h2 { padding-right: 32px; }
    .cds--tile--clickable.is-soon { position: relative; color: var(--cds-text-secondary); cursor: not-allowed; }
    .cds--tile--clickable.is-soon:hover, .cds--tile--clickable.is-soon:active { background: var(--cds-layer-01); }
    .cds--tile--clickable.is-soon svg { fill: var(--cds-icon-secondary); opacity: .6; }
    .cds--tile--clickable.is-soon svg.lock { position: absolute; top: 16px; right: 16px; width: 20px; height: 20px; opacity: .7; }

    @media (max-width: 1056px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .lead .row { grid-template-columns: 1fr; gap: 24px; } }

  <script>
    (function () {
      var BOARDS = [['ngc_data', 'Growth Readiness', 'readiness.html'], ['ngc_data_enabling', 'Enabling Work', 'enabling.html']];
      var IDX = [];
      BOARDS.forEach(function (b) {
        var d = null; try { d = JSON.parse(localStorage.getItem(b[0]) || 'null'); } catch (e) {}
        if (!d) return;
        (d.schools || []).forEach(function (s) { if (s && s.id) IDX.push({ t: (s.market || '') + ' ' + (s.display_label || ''), k: 'School opening', ws: b[1], href: b[2] + '?s=' + encodeURIComponent(s.id) }); });
        var people = {};
        (d.milestones || []).forEach(function (m) {
          if (!m || !m.id || m._draft) return;
          IDX.push({ t: m.activity || '', k: 'Milestone' + (m.owner ? ' · ' + m.owner : ''), ws: b[1], href: b[2] + '?m=' + encodeURIComponent(m.id), extra: [m.owner].concat(m.coOwners || []).join(' ') + ' ' + (m.market || '') });
          [m.owner].concat(m.coOwners || []).forEach(function (o) { if (o) people[o] = (people[o] || 0) + (m.status === 'complete' ? 0 : 1); });
        });
        Object.keys(people).forEach(function (o) { IDX.push({ t: o, k: people[o] + ' open milestone' + (people[o] === 1 ? '' : 's'), ws: b[1], href: b[2] + '?f=' + encodeURIComponent(JSON.stringify({ owners: [o] })) + '#plan', person: true }); });
      });
      function escH(v) { return String(v).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
      var NAMES = { readiness: ['Growth Readiness', 'readiness.html'], enabling: ['Enabling Work', 'enabling.html'] };
      var q = document.getElementById('q'), list = document.getElementById('results'), box = q.closest('.cds--search');
      var shown = [], sel = 0;

      try {
        var last = NAMES[localStorage.getItem('ngc_last_ws')];
        if (last) { var a = document.getElementById('lastLink'); a.textContent = last[0]; a.href = last[1]; document.getElementById('last').hidden = false; }
      } catch (e) {}


      function match(a, words) { var s = (a.t + ' ' + (a.extra || '')).toLowerCase(); return words.every(function (w) { return s.indexOf(w) > -1; }); }
      function render() {
        var words = q.value.toLowerCase().split(/\s+/).filter(Boolean);
        if (!words.length) { shown = []; open(false); return; }
        var hits = IDX.filter(function (a) { return match(a, words); });
        hits.sort(function (a, b) { return (b.person ? 2 : b.k === 'School opening' ? 1 : 0) - (a.person ? 2 : a.k === 'School opening' ? 1 : 0); });
        shown = hits.slice(0, 8); var more = hits.length - shown.length;
        try { document.getElementById('resCount').textContent = hits.length ? hits.length + ' result' + (hits.length === 1 ? '' : 's') : 'No matches'; } catch (e) {}
        if (more > 0) shown.push({ t: more + ' more match' + (more === 1 ? '' : 'es'), k: 'Show them on the board', ws: shown[0].ws, href: (shown[0].ws === 'Enabling Work' ? 'enabling.html' : 'readiness.html') + '?q=' + encodeURIComponent(q.value.trim()) + '#plan' });
        if (words.length) { var qq = q.value.trim(), qe = encodeURIComponent(qq), qt = qq;
          shown = shown.concat([{ t: 'Find \u201c' + qt + '\u201d', ws: 'Growth Readiness', href: 'readiness.html?q=' + qe + '#plan' }, { t: 'Find \u201c' + qt + '\u201d', ws: 'Enabling Work', href: 'enabling.html?q=' + qe + '#plan' }]); }
        sel = 0;
        list.innerHTML = shown.length ? shown.map(function (a, i) {
          return '<li class="cds--list-box__menu-item" role="presentation"><a role="option" id="opt' + i + '" href="' + escH(a.href) + '" aria-selected="' + (i === sel) + '">' + escH(a.t) + '<span>' + escH((a.k ? a.k + ' · ' : '') + a.ws) + '</span></a></li>';
        }).join('') : '<li class="cds--list-box__empty">No results</li>';
        open(true);
      }
      function open(on) { list.hidden = !on; box.setAttribute('aria-expanded', on ? 'true' : 'false'); if (!on) q.removeAttribute('aria-activedescendant'); }
      function mark() { [].forEach.call(list.querySelectorAll('a'), function (el, i) { el.setAttribute('aria-selected', i === sel ? 'true' : 'false'); }); q.setAttribute('aria-activedescendant', 'opt' + sel); }

      document.addEventListener('keydown', function (e) { if (e.key === '/' && document.activeElement !== q && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); q.focus(); } });
      // 37 nothing saved in this browser yet: say how search fills up
      if (!IDX.length) q.placeholder = 'Open a board once, then search it here';
      q.addEventListener('focus', render);
      q.addEventListener('input', render);
      q.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowDown') { e.preventDefault(); if (shown.length) { sel = (sel + 1) % shown.length; mark(); } }
        else if (e.key === 'ArrowUp') { e.preventDefault(); if (shown.length) { sel = (sel - 1 + shown.length) % shown.length; mark(); } }
        else if (e.key === 'Enter') { e.preventDefault(); var a = shown[sel]; if (a) location.href = a.href; }
        else if (e.key === 'Escape') { if (q.value) { q.value = ''; open(false); } else { open(false); q.blur(); } }
      });
      document.addEventListener('click', function (e) { if (!box.contains(e.target)) open(false); });
      box.addEventListener('focusout', function (e) { if (!box.contains(e.relatedTarget)) open(false); });
    })();
